<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank You — Free Creative Dashboard</title>
<style>
  :root{
    --bg:#060608;--surface:#14141c;--text:#e8e6e3;--text2:#98968e;--accent:#d4a853;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
  .wrap{max-width:520px;padding:48px 24px;text-align:center}
  .badge{display:inline-block;padding:6px 14px;background:rgba(212,168,83,0.08);color:var(--accent);border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:16px}
  h1{font-size:28px;margin-bottom:14px}
  h1 span{color:var(--accent)}
  p{color:var(--text2);font-size:15px;margin-bottom:24px;line-height:1.6}
  .btn{display:inline-block;padding:14px 32px;background:var(--accent);color:#060608;border-radius:8px;font-weight:700;font-size:15px;text-decoration:none}
  .support{margin-top:24px;font-size:12px;color:var(--text2)}
  .support a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">Access Confirmed</div>
  <h1>Your Free <span>Creative Dashboard</span> Is Ready</h1>
  <p>It runs entirely in your browser — no install, no account, 100% offline. Bookmark the page; your data saves automatically as you use it.</p>
  <a href="index.html" class="btn">Open Creative Dashboard</a>
  <p class="support">Questions? <a href="mailto:neatlyshop@outlook.com">neatlyshop@outlook.com</a></p>
</div>
</body>
</html>
